<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grainy Aura Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.7);
        }

        /* Custom Range Input Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155;
            border-radius: 9999px;
            transition: background 0.2s;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #f472b6;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
            transition: transform 0.1s, background-color 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #ec4899;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="h-full flex flex-col lg:flex-row overflow-hidden bg-slate-950 text-slate-100">

    <!-- Canvas Preview Area -->
    <main class="flex-1 relative flex flex-col justify-center items-center p-3 lg:p-6 overflow-hidden bg-slate-950">
        
        <!-- Header Bar -->
        <header class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-none">
            <div class="flex items-center gap-3 bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 pointer-events-auto shadow-lg">
                <div class="w-3 h-3 rounded-full bg-pink-500 animate-pulse"></div>
                <h1 class="text-xs sm:text-sm font-semibold tracking-wide text-slate-200">Grainy Aura Studio <span class="text-pink-400 font-normal text-xs ml-1">(18 Art Styles)</span></h1>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <button id="btn-animate" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/90 hover:bg-slate-800 text-xs font-medium text-slate-300 border border-white/10 shadow-lg transition-all">
                    <svg id="icon-play" class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span id="label-animate">Animate Aura</span>
                </button>
            </div>
        </header>

        <!-- Canvas Wrapper -->
        <div id="canvas-wrapper" class="relative w-full max-w-5xl aspect-[2/1] rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-slate-900 flex items-center justify-center">
            <canvas id="aura-canvas" class="w-full h-full object-contain cursor-crosshair"></canvas>
            
            <div id="loading-spinner" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none">
                <div class="w-8 h-8 border-2 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-xs font-medium text-pink-300">Rendering high-res texture...</span>
            </div>
        </div>

        <!-- Canvas Info Footer -->
        <div class="mt-3 flex items-center justify-between w-full max-w-5xl text-[11px] text-slate-400 px-2">
            <span id="resolution-indicator" class="font-mono text-pink-400">2160 × 1080 px (2:1 Ultrawide)</span>
            <span>Click & Drag canvas to reposition aura origin</span>
        </div>
    </main>

    <!-- Sidebar Control Panel -->
    <aside class="w-full lg:w-96 glass-panel border-t lg:border-t-0 lg:border-l border-white/10 flex flex-col h-[50vh] lg:h-full z-10 overflow-hidden flex-shrink-0">
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-white/10 bg-slate-900/60 p-1 gap-1">
            <button data-tab="presets" class="tab-btn active flex-1 py-2 text-xs font-medium rounded-lg text-slate-300 transition-all bg-pink-500/20 text-pink-300 border border-pink-500/30">Gallery (18)</button>
            <button data-tab="orb" class="tab-btn flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all">Position</button>
            <button data-tab="glow" class="tab-btn flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all">Colors & Grain</button>
            <button data-tab="export" class="tab-btn flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all">Export</button>
        </div>

        <!-- Scrollable Tab Contents -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            
            <!-- TAB 1: ALL PRESETS (1 - 18) -->
            <div id="tab-presets" class="tab-content space-y-3">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Artwork Preset Gallery</h3>
                    <span class="text-[10px] text-pink-400 font-mono">18 Styles</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    
                    <!-- Preset 1: Magenta Orb -->
                    <button data-preset="magenta" class="preset-card group p-2.5 rounded-xl border border-pink-500/40 bg-slate-900/60 hover:border-pink-500 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-purple-950 via-pink-600 to-rose-400 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-pink-300 truncate">1. Magenta Orb</span>
                    </button>

                    <!-- Preset 2: Cyber Cyan -->
                    <button data-preset="cyberpunk" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-cyan-500 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-blue-950 via-purple-600 to-cyan-400 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-cyan-300 truncate">2. Cyber Cyan</span>
                    </button>

                    <!-- Preset 3: Sunset Solar -->
                    <button data-preset="amber" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-amber-500 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-stone-950 via-orange-600 to-amber-300 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-amber-300 truncate">3. Sunset Solar</span>
                    </button>

                    <!-- Preset 4: Emerald Ether -->
                    <button data-preset="emerald" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-emerald-500 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-slate-950 via-teal-700 to-emerald-400 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-emerald-300 truncate">4. Emerald Ether</span>
                    </button>

                    <!-- Preset 5: Vivid Magenta Tunnel -->
                    <button data-preset="tunnel" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-purple-500 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-fuchsia-950 via-purple-700 to-pink-500 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-purple-300 truncate">5. Magenta Tunnel</span>
                    </button>

                    <!-- Preset 6: Grainy Pink Wave -->
                    <button data-preset="pink_wave" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-pink-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-slate-950 via-pink-400 to-purple-900 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-pink-300 truncate">6. Pink S-Wave</span>
                    </button>

                    <!-- Preset 7: Grainy Blue Tri-Aura -->
                    <button data-preset="blue_aura" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-sky-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-blue-950 via-sky-500 to-indigo-900 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-sky-300 truncate">7. Blue Tri-Aura</span>
                    </button>

                    <!-- Preset 8: Cyan Amber Hourglass -->
                    <button data-preset="cyan_amber" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-cyan-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-cyan-500 via-amber-200 to-orange-500 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-amber-300 truncate">8. Cyan Amber Stream</span>
                    </button>

                    <!-- Preset 9: Pastel Sky -->
                    <button data-preset="pastel_sky" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-sky-300 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-sky-300 via-stone-200 to-orange-100 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-sky-200 truncate">9. Pastel Sky</span>
                    </button>

                    <!-- Preset 10: Silver Metallic Satin -->
                    <button data-preset="silver_satin" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-slate-300 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-slate-800 via-slate-100 to-slate-900 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-slate-100 truncate">10. Silver Satin</span>
                    </button>

                    <!-- Preset 11: Monochrome Beam -->
                    <button data-preset="mono_beam" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-slate-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-black via-slate-200 to-zinc-950 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-slate-300 truncate">11. Monochrome Beam</span>
                    </button>

                    <!-- Preset 12: Lime Green Plum Leak -->
                    <button data-preset="lime_plum" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-lime-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-fuchsia-950 via-lime-400 to-yellow-100 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-lime-300 truncate">12. Lime Plum Leak</span>
                    </button>

                    <!-- Preset 13: Sunset Teal Leak -->
                    <button data-preset="sunset_teal" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-orange-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-amber-500 via-orange-600 to-teal-800 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-orange-300 truncate">13. Sunset Teal Leak</span>
                    </button>

                    <!-- Preset 14: Grayscale Gradient -->
                    <button data-preset="mono_gradient" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-zinc-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-zinc-900 via-zinc-400 to-zinc-100 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-zinc-300 truncate">14. Mono Gradient</span>
                    </button>

                    <!-- Preset 15: Floating 3D Hearts -->
                    <button data-preset="hearts" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-rose-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-pink-100 via-rose-400 to-pink-500 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#f43f5e_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-rose-300 truncate">15. Floating 3D Hearts</span>
                    </button>

                    <!-- Preset 16: Cobalt Silk Wave -->
                    <button data-preset="cobalt_silk" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-blue-500 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-blue-950 via-blue-600 to-sky-400 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-blue-300 truncate">16. Cobalt Silk Wave</span>
                    </button>

                    <!-- Preset 17: Golden Silk Wave -->
                    <button data-preset="golden_silk" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-amber-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-stone-950 via-amber-500 to-yellow-200 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-amber-300 truncate">17. Golden Silk Wave</span>
                    </button>

                    <!-- Preset 18: Cyan Light Ribbon -->
                    <button data-preset="cyan_ribbon" class="preset-card group p-2.5 rounded-xl border border-white/10 bg-slate-900/60 hover:border-cyan-400 flex flex-col gap-1.5 transition-all text-left">
                        <div class="w-full h-10 rounded-lg bg-gradient-to-r from-slate-950 via-cyan-500 to-sky-200 relative overflow-hidden">
                            <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:6px_6px]"></div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-200 group-hover:text-cyan-300 truncate">18. Cyan Light Ribbon</span>
                    </button>

                </div>
            </div>

            <!-- TAB 2: POSITION & SHAPE -->
            <div id="tab-orb" class="tab-content hidden space-y-5">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Position & Radius Controls</h3>
                
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <label class="text-slate-300">Aura Radius Size</label>
                        <span id="val-orbRadius" class="text-pink-400 font-mono">410px</span>
                    </div>
                    <input type="range" id="param-orbRadius" min="100" max="800" value="410" class="w-full">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <label class="text-slate-300">Aura Soft Blur</label>
                        <span id="val-orbBlur" class="text-pink-400 font-mono">65px</span>
                    </div>
                    <input type="range" id="param-orbBlur" min="0" max="200" value="65" class="w-full">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <label class="text-slate-300">Horizontal Position X</label>
                        <span id="val-orbX" class="text-pink-400 font-mono">35%</span>
                    </div>
                    <input type="range" id="param-orbX" min="0" max="100" value="35" class="w-full">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <label class="text-slate-300">Vertical Position Y</label>
                        <span id="val-orbY" class="text-pink-400 font-mono">50%</span>
                    </div>
                    <input type="range" id="param-orbY" min="0" max="100" value="50" class="w-full">
                </div>

                <div class="space-y-2 pt-2 border-t border-white/10">
                    <div class="flex justify-between text-xs">
                        <label class="text-slate-300">Crease / Shadow Depth</label>
                        <span id="val-shadowDepth" class="text-pink-400 font-mono">80%</span>
                    </div>
                    <input type="range" id="param-shadowDepth" min="0" max="100" value="80" class="w-full">
                </div>
            </div>

            <!-- TAB 3: COLORS & GRAIN -->
            <div id="tab-glow" class="tab-content hidden space-y-5">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Background Colors & Grain</h3>
                
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <label class="text-slate-300">Grain / Noise Density</label>
                        <span id="val-grainAmount" class="text-pink-400 font-mono">18%</span>
                    </div>
                    <input type="range" id="param-grainAmount" min="0" max="50" value="18" class="w-full">
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/10">
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400">Main Light</label>
                        <input type="color" id="param-orbColor" value="#ff41a5" class="w-full h-8 rounded border border-white/10 bg-slate-900 cursor-pointer">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400">Base Void</label>
                        <input type="color" id="param-bgColor" value="#1a081a" class="w-full h-8 rounded border border-white/10 bg-slate-900 cursor-pointer">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400">Ambient Glow</label>
                        <input type="color" id="param-ambientColor" value="#f01496" class="w-full h-8 rounded border border-white/10 bg-slate-900 cursor-pointer">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400">Accent Crest</label>
                        <input type="color" id="param-accentColor" value="#ffffff" class="w-full h-8 rounded border border-white/10 bg-slate-900 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- TAB 4: EXPORT -->
            <div id="tab-export" class="tab-content hidden space-y-5">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Export Artwork</h3>
                
                <div class="space-y-2">
                    <label class="text-xs text-slate-300">Output Resolution</label>
                    <select id="param-resolution" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                        <option value="2160x1080">2160 × 1080 (2:1 Ultrawide Reference)</option>
                        <option value="1920x1080">1920 × 1080 (16:9 Wallpaper)</option>
                        <option value="1080x1080">1080 × 1080 (1:1 Square)</option>
                        <option value="1080x1920">1080 × 1920 (9:16 Mobile Story)</option>
                        <option value="3840x2160">3840 × 2160 (4K UHD Wide)</option>
                    </select>
                </div>

                <button id="btn-export" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-semibold text-xs rounded-xl shadow-lg shadow-pink-500/25 transition-all flex items-center justify-center gap-2">

        // DOM References
        const canvas = document.getElementById('aura-canvas');
        const ctx = canvas.getContext('2d');

        // Offscreen noise buffer
        let noiseCanvas = document.createElement('canvas');
        let noiseCtx = noiseCanvas.getContext('2d');

        function generateNoisePattern(width, height, amount) {
            noiseCanvas.width = width;
            noiseCanvas.height = height;
            const imgData = noiseCtx.createImageData(width, height);
            const data = imgData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const grain = (Math.random() - 0.5) * 255 * (amount * 2.5);
                const val = Math.min(255, Math.max(0, 128 + grain));
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = Math.abs(grain) * 1.5;
            }
            noiseCtx.putImageData(imgData, 0, 0);
        }

        function render() {
            const w = state.width;
            const h = state.height;

            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
                generateNoisePattern(w / state.grainScale, h / state.grainScale, state.grainAmount);
            }

            // Base Fill
            ctx.fillStyle = state.bgColor;
            ctx.fillRect(0, 0, w, h);

            // Delegate to mode-specific renderers
            if (state.mode === 'magenta' || state.mode === 'cyberpunk' || state.mode === 'amber' || state.mode === 'emerald') {
                renderOrbMode(w, h);
            } else if (state.mode === 'pink_wave') {
                renderWaveMode(w, h);
            } else if (state.mode === 'blue_aura') {
                renderTriRadialMode(w, h);
            } else if (state.mode === 'cyan_amber') {
                renderHourglassMode(w, h);
            } else if (state.mode === 'pastel_sky') {
                renderPastelSkyMode(w, h);
            } else if (state.mode === 'silver_satin') {
                renderSilverSatinMode(w, h);
            } else if (state.mode === 'mono_beam') {
                renderMonoBeamMode(w, h);
            } else if (state.mode === 'lime_plum') {
                renderLimePlumMode(w, h);
            } else if (state.mode === 'sunset_teal') {
                renderSunsetTealMode(w, h);
            } else if (state.mode === 'mono_gradient') {
                renderMonoGradientMode(w, h);
            } else if (state.mode === 'hearts') {
                renderHeartsMode(w, h);
            } else if (state.mode === 'cobalt_silk') {
                renderCobaltSilkMode(w, h);
            } else if (state.mode === 'golden_silk') {
                renderGoldenSilkMode(w, h);
            } else if (state.mode === 'cyan_ribbon') {
                renderCyanRibbonMode(w, h);
            } else {
                renderOrbMode(w, h);
            }

            // Grain Overlay
            ctx.globalCompositeOperation = 'overlay';
            ctx.drawImage(noiseCanvas, 0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';

            if (state.animating) {
                requestAnimationFrame(render);
            }
        }

        // Mode 1: Classic Orb Core
        function renderOrbMode(w, h) {
            ctx.globalCompositeOperation = 'screen';
            
            const g1 = ctx.createRadialGradient(w * 0.72, h * 0.58, 0, w * 0.72, h * 0.58, w * 0.6);
            g1.addColorStop(0, hexToRgba(state.ambientColor, 0.9));
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, w, h);

            let animX = state.animating ? Math.sin(state.animTime) * 20 : 0;
            let animY = state.animating ? Math.cos(state.animTime * 0.8) * 15 : 0;

            const orbX = (w * state.orbX) + animX;
            const orbY = (h * state.orbY) + animY;

            const g2 = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, state.orbRadius);
            g2.addColorStop(0, state.orbColor);
            g2.addColorStop(0.7, hexToRgba(state.orbColor, 0.85));
            g2.addColorStop(1, 'transparent');

            ctx.save();
            ctx.filter = `blur(${state.orbBlur}px)`;
            ctx.fillStyle = g2;
            ctx.beginPath();
            ctx.arc(orbX, orbY, state.orbRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Spherical Shadow
            ctx.globalCompositeOperation = 'multiply';
            const shadowY = orbY - (state.orbRadius * 0.45);
            const gShadow = ctx.createRadialGradient(orbX, shadowY, 0, orbX, shadowY, state.orbRadius * 1.2);
            gShadow.addColorStop(0, `rgba(10, 2, 10, ${state.shadowDepth})`);
            gShadow.addColorStop(0.8, 'transparent');

            ctx.save();
            ctx.filter = `blur(${state.orbBlur * 1.2}px)`;
            ctx.fillStyle = gShadow;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }

        // Mode 16: Cobalt Silk Wave
        function renderCobaltSilkMode(w, h) {
            ctx.globalCompositeOperation = 'screen';
            
            const g1 = ctx.createRadialGradient(w * 0.35, h * 0.45, 0, w * 0.35, h * 0.45, w * 0.60);
            g1.addColorStop(0, state.orbColor);
            g1.addColorStop(0.7, hexToRgba(state.ambientColor, 0.85));
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, w, h);

            shadow.addColorStop(1, 'transparent');
            ctx.fillStyle = shadow;
            ctx.fillRect(0, 0, w, h);
        }

        // Mode 18: Cyan Light Ribbon

        function renderWaveMode(w, h) {
            ctx.globalCompositeOperation = 'screen';

        function renderTriRadialMode(w, h) {

        function renderLimePlumMode(w, h) {

        function renderSunsetTealMode(w, h) {
            ctx.globalCompositeOperation = 'screen';
            const g1 = ctx.createRadialGradient(w * 0.55, h * 0.82, 0, w * 0.55, h * 0.82, w * 0.6);
            g1.addColorStop(0, state.orbColor);
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, w, h);
        }

        function renderMonoGradientMode(w, h) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'multiply';
            const g1 = ctx.createRadialGradient(w * 0.22, h * 0.88, 0, w * 0.22, h * 0.88, w * 0.6);
            g1.addColorStop(0, '#101010');
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';
        }

        function renderHeartsMode(w, h) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            
            // Draw a series of soft hearts
            const hearts = [
                {x: 0.22, y: 0.68, size: 160, color: state.orbColor},
                {x: 0.63, y: 0.79, size: 170, color: state.orbColor},
                {x: 0.82, y: 0.44, size: 185, color: state.ambientColor}
            ];

            hearts.forEach(heart => {
                drawHeart(ctx, w * heart.x, h * heart.y, heart.size, heart.color);
            });
        }

        function drawHeart(ctx, cx, cy, size, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(cx, cy + topCurveHeight);
            ctx.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size / 2, cy + topCurveHeight);
            ctx.bezierCurveTo(cx - size / 2, cy + (size + topCurveHeight) / 2, cx, cy + size, cx, cy + size);
            ctx.bezierCurveTo(cx, cy + size, cx + size / 2, cy + (size + topCurveHeight) / 2, cx + size / 2, cy + topCurveHeight);
            ctx.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // Helper Utility
        function hexToRgba(hex, alpha) {
            if (!hex || hex[0] !== '#') return `rgba(255, 255, 255, ${alpha})`;
            const r = parseInt(hex.slice(1, 3), 16) || 255;
            const g = parseInt(hex.slice(3, 5), 16) || 255;
            const b = parseInt(hex.slice(5, 7), 16) || 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-pink-500/20', 'text-pink-300', 'border-pink-500/30', 'border');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-pink-500/20', 'text-pink-300', 'border-pink-500/30', 'border');
                btn.classList.remove('text-slate-400');

                const target = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${target}`).classList.remove('hidden');
            });
        });

        // Preset Handler
        document.querySelectorAll('.preset-card').forEach(card => {
            card.addEventListener('click', () => {
                const presetKey = card.dataset.preset;
                const p = presets[presetKey];
                if (!p) return;

                Object.assign(state, p);

                // Update Control Values
                document.getElementById('param-orbColor').value = p.orbColor;
                document.getElementById('param-bgColor').value = p.bgColor;
                document.getElementById('param-ambientColor').value = p.ambientColor;
                document.getElementById('param-accentColor').value = p.accentColor || '#ffffff';
                document.getElementById('param-orbX').value = Math.round(p.orbX * 100);
                document.getElementById('val-orbX').textContent = `${Math.round(p.orbX * 100)}%`;
                document.getElementById('param-orbY').value = Math.round(p.orbY * 100);
                document.getElementById('val-orbY').textContent = `${Math.round(p.orbY * 100)}%`;
                document.getElementById('param-orbRadius').value = p.orbRadius;
                document.getElementById('val-orbRadius').textContent = `${p.orbRadius}px`;

                if (!state.animating) render();
            });
        });

        // Slider Input Controls
        function bindParam(id, stateProp, formatFn) {
            const input = document.getElementById(`param-${id}`);
            const valLabel = document.getElementById(`val-${id}`);
            if (!input) return;

            input.addEventListener('input', (e) => {
                let value = e.target.type === 'range' ? parseFloat(e.target.value) : e.target.value;
                if (id === 'orbX' || id === 'orbY') value = value / 100;
                
                state[stateProp] = value;
                if (valLabel) {
                    valLabel.textContent = formatFn ? formatFn(e.target.value) : e.target.value;
                }

                if (id === 'grainAmount') {
                    generateNoisePattern(state.width / state.grainScale, state.height / state.grainScale, state.grainAmount);
                }

                if (!state.animating) render();
            });
        }

        bindParam('orbRadius', 'orbRadius', v => `${v}px`);
        bindParam('orbBlur', 'orbBlur', v => `${v}px`);
        bindParam('orbX', 'orbX', v => `${v}%`);
        bindParam('orbY', 'orbY', v => `${v}%`);
        bindParam('shadowDepth', 'shadowDepth', v => `${v}%`);
        bindParam('grainAmount', 'grainAmount', v => `${v}%`);
        bindParam('orbColor', 'orbColor');
        bindParam('bgColor', 'bgColor');
        bindParam('ambientColor', 'ambientColor');
        bindParam('accentColor', 'accentColor');

        // Motion Animation Toggle
        const animBtn = document.getElementById('btn-animate');
        const animLabel = document.getElementById('label-animate');
        animBtn.addEventListener('click', () => {
            state.animating = !state.animating;
            if (state.animating) {
                animBtn.classList.add('bg-pink-500', 'text-white');
                animLabel.textContent = 'Pause Motion';
                render();
            } else {
                animBtn.classList.remove('bg-pink-500', 'text-white');
                animLabel.textContent = 'Animate Aura';
            }
        });

        // Click & Drag Positioning
        let isDragging = false;
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            updatePositionFromClick(e);
        });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) updatePositionFromClick(e);
        });
        window.addEventListener('mouseup', () => isDragging = false);

        function updatePositionFromClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.min(Math.max(0, e.clientX - rect.left), rect.width) / rect.width;
            const y = Math.min(Math.max(0, e.clientY - rect.top), rect.height) / rect.height;

            state.orbX = x;
            state.orbY = y;

            const inputX = document.getElementById('param-orbX');
            const inputY = document.getElementById('param-orbY');
            if (inputX) inputX.value = Math.round(x * 100);
            if (inputY) inputY.value = Math.round(y * 100);

            document.getElementById('val-orbX').textContent = `${Math.round(x * 100)}%`;
            document.getElementById('val-orbY').textContent = `${Math.round(y * 100)}%`;

            if (!state.animating) render();
        }

        // Export PNG Logic
        document.getElementById('param-resolution').addEventListener('change', (e) => {
            const [w, h] = e.target.value.split('x').map(Number);
            state.width = w;
            state.height = h;
            document.getElementById('resolution-indicator').textContent = `${w} × ${h} px`;
            generateNoisePattern(w / state.grainScale, h / state.grainScale, state.grainAmount);
            if (!state.animating) render();
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            const spinner = document.getElementById('loading-spinner');
            spinner.classList.remove('opacity-0', 'pointer-events-none');

            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `Grainy_Aura_Studio_${state.mode}_${state.width}x${state.height}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                spinner.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
